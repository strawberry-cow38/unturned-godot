[package]
name = "unturned-bevy"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
description = "Bevy engine host for the Unturned port"

[dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["3d", "ui", "audio", "wav", "png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bevy_rapier3d = { version = "=0.37.0", default-features = false, features = ["dim3"] }

[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

