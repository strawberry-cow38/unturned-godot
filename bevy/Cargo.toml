[package]
name = "unturned-bevy"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
description = "Bevy engine host for the Unturned port"

[dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["3d", "ui", "audio", "wav", "vorbis", "png", "jpeg", "system_clipboard"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
fastnoise-lite = "=1.1.1"
bevy_rapier3d = { version = "=0.37.0", default-features = false, features = ["dim3"] }
# Bevy's own (locked) ctrlc with SIGTERM/SIGHUP: `--dedicated` turns systemd's
# stop into a graceful AppExit that writes the final world save.
ctrlc = { version = "=3.5.2", features = ["termination"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Godot LineEdit's primary selection is distinct from the normal clipboard.
arboard = { version = "=3.6.1", default-features = false }

# Mouse clicks use this frame's hit; vanished touch pointers retain the original
# previous-frame behavior. See vendor/bevy_picking/PATCHES.md and UI regressions.
[patch.crates-io]
bevy_picking = { path = "vendor/bevy_picking" }
# Focused keyboard observers see each event's modifiers; polled input retains
# the engine's final frame state. See vendor/bevy_input_focus/PATCHES.md.
bevy_input_focus = { path = "vendor/bevy_input_focus" }

[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

